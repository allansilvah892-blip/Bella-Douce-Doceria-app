<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Douce Doceria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="https://i.imgur.com/8Q9N4yD.png">
    <link rel="icon" type="image/png" href="https://i.imgur.com/8Q9N4yD.png">
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIkJlbGxhIERvdWNlIERvY2VyaWEiLAogICJzaG9ydF9uYW1lIjogIkJlbGxhIERvdWNlIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNmOGZhd3AiLAogICJ0aGVtZV9jb2xvcIjogIiMwZjE3MmEiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJodHRwczovL2kuaW1ndXIuY29tLzhROU40eUQucG5nIiwKICAgICAgInNpemVzIjogIjUxMng1MTIiLAogICAgICAidHlwZSI6ICJpbWFnZS9wbmciCiAgICB9CiAgXQp9">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">
    <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://i.imgur.com/8Q9N4yD.png" alt="Bella Douce Logo" class="w-10 h-10 rounded-full border-2 border-sky-300">
                <div>
                    <h1 class="font-bold text-lg text-sky-200">Bella Douce</h1>
                    <p class="text-xs text-slate-400">Doceria & Gestão</p>
                </div>
            </div>
            <button onclick="zerarTudo()" class="bg-rose-500/20 hover:bg-rose-500 text-rose-300 hover:text-white px-2.5 py-1 rounded-lg text-xs border border-rose-500/30 transition-all">
                Zerar Dados
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Navegação por Abas -->
        <div class="grid grid-cols-3 gap-2 bg-slate-200 p-1 rounded-xl text-center text-xs font-semibold">
            <button onclick="mudarAba('pdv')" id="btn-pdv" class="py-2 rounded-lg bg-slate-900 text-white shadow">PDV / Caixa</button>
            <button onclick="mudarAba('estoque')" id="btn-estoque" class="py-2 rounded-lg text-slate-600">Estoque</button>
            <button onclick="mudarAba('relatorios')" id="btn-relatorios" class="py-2 rounded-lg text-slate-600">Relatórios</button>
        </div>

        <!-- Conteúdo PDV -->
        <div id="aba-pdv" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                <h2 class="font-bold text-slate-700 text-sm">Nova Venda</h2>
                <select id="pdv-produto" class="w-full p-2.5 rounded-lg border border-slate-200 text-sm bg-slate-50"></select>
                <div class="flex gap-2">
                    <input type="number" id="pdv-qtd" value="1" min="1" class="w-24 p-2.5 rounded-lg border border-slate-200 text-sm bg-slate-50" placeholder="Qtd">
                    <button onclick="adicionarAoCarrinho()" class="flex-1 bg-sky-500 hover:bg-sky-600 text-white font-semibold rounded-lg text-sm transition-all">Adicionar</button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                <h3 class="font-bold text-slate-700 text-sm">Carrinho</h3>
                <div id="carrinho-lista" class="text-sm space-y-2 divide-y divide-slate-100">
                    <p class="text-slate-400 text-center py-2">Carrinho vazio</p>
                </div>
                <div class="pt-2 border-t border-slate-100 flex justify-between items-center font-bold text-base">
                    <span>Total:</span>
                    <span id="carrinho-total" class="text-slate-900">R$ 0,00</span>
                </div>
                <button onclick="finalizarVenda()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition-all shadow-md">
                    Finalizar Venda
                </button>
            </div>
        </div>

        <!-- Conteúdo Estoque -->
        <div id="aba-estoque" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                <h2 class="font-bold text-slate-700 text-sm">Cadastrar Produto</h2>
                <input type="text" id="prod-nome" placeholder="Nome do Doce/Produto" class="w-full p-2.5 rounded-lg border border-slate-200 text-sm bg-slate-50">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="prod-custo" step="0.01" placeholder="Custo (Opcional)" class="p-2.5 rounded-lg border border-slate-200 text-sm bg-slate-50">
                    <input type="number" id="prod-preco" step="0.01" placeholder="Preço Venda (R$)" class="p-2.5 rounded-lg border border-slate-200 text-sm bg-slate-50">
                </div>
                <input type="number" id="prod-qtd" placeholder="Quantidade em Estoque" class="w-full p-2.5 rounded-lg border border-slate-200 text-sm bg-slate-50">
                <button onclick="salvarProduto()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2.5 rounded-lg text-sm transition-all">
                    Salvar Produto
                </button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-700 text-sm mb-3">Produtos Cadastrados</h3>
                <div id="estoque-lista" class="space-y-2 text-sm"></div>
            </div>
        </div>

        <!-- Conteúdo Relatórios & Backup -->
        <div id="aba-relatorios" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                <h2 class="font-bold text-slate-700 text-sm">Resumo Financeiro</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-sky-50 p-3 rounded-lg border border-sky-100">
                        <span class="text-xs text-sky-700 block">Faturamento</span>
                        <span id="rel-faturamento" class="font-bold text-slate-900 text-lg">R$ 0,00</span>
                    </div>
                    <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-100">
                        <span class="text-xs text-emerald-700 block">Lucro Estimado</span>
                        <span id="rel-lucro" class="font-bold text-emerald-900 text-lg">R$ 0,00</span>
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                <h3 class="font-bold text-slate-700 text-sm">Cópia de Segurança (Backup)</h3>
                <p class="text-xs text-slate-500">Exporte os seus dados para não perder nada ao atualizar ou trocar de telemóvel.</p>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportarBackup()" class="bg-slate-900 text-white font-medium py-2 rounded-lg text-xs hover:bg-slate-800 transition-all">
                        📥 Exportar Backup
                    </button>
                    <label class="bg-sky-100 text-sky-800 font-medium py-2 rounded-lg text-xs text-center cursor-pointer hover:bg-sky-200 transition-all block">
                        📤 Importar Backup
                        <input type="file" onchange="importarBackup(event)" accept=".json" class="hidden">
                    </label>
                </div>
            </div>
        </div>
    </main>

    <script>
        let db = JSON.parse(localStorage.getItem('bella_douce_db')) ||  {
    produtos: [
        { id: 1, nome: "Brigadeiro Gourmet Belga", categoria: "Doces Tradicionais", custo: 1.20, venda: 3.50, estoque: 40 },
        { id: 2, nome: "Bolo no Pote Ninho c/ Nutella", categoria: "Bolos & Tortas", custo: 4.50, venda: 12.00, estoque: 15 },
        { id: 3, nome: "Coxinha de Morango c/ Chocolate", categoria: "Doces Tradicionais", custo: 2.50, venda: 7.00, estoque: 20 },
        { id: 4, nome: "Torta de Limão (Fatia)", categoria: "Bolos & Tortas", custo: 3.00, venda: 9.50, estoque: 10 }
    ],
    clientes: [
        { id: 1, nome: "Ana Paula de Souza", telefone: "(11) 98888-1122", saldoFiado: 24.50 }
    ],
    vendas: [
        { id: 101, data: "22/10/2026 10:15", cliente: "Ana Paula de Souza", total: 24.50, formaPgto: "Fiado", custoTotal: 8.40 }
    ],
    carrinho: []
}


        function salvarDB() {
            localStorage.setItem('bella_douce_db', JSON.stringify(db));
            atualizarTudo();
        }

        function mudarAba(aba) {
            ['pdv', 'estoque', 'relatorios'].forEach(a => {
                document.getElementById('aba-' + a).classList.add('hidden');
                document.getElementById('btn-' + a).className = 'py-2 rounded-lg text-slate-600';
            });
            document.getElementById('aba-' + aba).classList.remove('hidden');
            document.getElementById('btn-' + aba).className = 'py-2 rounded-lg bg-slate-900 text-white shadow';
        }

        function salvarProduto() {
            const nome = document.getElementById('prod-nome').value;
            const custo = parseFloat(document.getElementById('prod-custo').value) || 0;
            const preco = parseFloat(document.getElementById('prod-preco').value) || 0;
            const qtd = parseInt(document.getElementById('prod-qtd').value) || 0;

            if (!nome || preco <= 0) return alert('Informe o nome e preço de venda válidos!');

            db.produtos.push({ id: Date.now(), nome, custo, preco, qtd });
            salvarDB();
            
            document.getElementById('prod-nome').value = '';
            document.getElementById('prod-custo').value = '';
            document.getElementById('prod-preco').value = '';
            document.getElementById('prod-qtd').value = '';
        }

        function adicionarAoCarrinho() {
            const id = parseInt(document.getElementById('pdv-produto').value);
            const qtd = parseInt(document.getElementById('pdv-qtd').value) || 1;
            const prod = db.produtos.find(p => p.id === id);

            if (!prod) return alert('Selecione um produto!');
            if (prod.qtd < qtd) return alert('Estoque insuficiente!');

            db.carrinho.push({ ...prod, qtdCarrinho: qtd });
            salvarDB();
        }

        function finalizarVenda() {
            if (db.carrinho.length === 0) return alert('Carrinho vazio!');
            
            db.carrinho.forEach(item => {
                const prod = db.produtos.find(p => p.id === item.id);
                if (prod) prod.qtd -= item.qtdCarrinho;
                db.vendas.push({ ...item, data: new Date().toISOString() });
            });

            db.carrinho = [];
            salvarDB();
            alert('Venda finalizada com sucesso!');
        }

        function zerarTudo() {
            if (confirm('Atenção: Deseja apagar TODOS os produtos, vendas e dados salvos?')) {
                localStorage.removeItem('bella_douce_db');
                db = { produtos: [], vendas: [], carrinho: [] };
                salvarDB();
                alert('Banco de dados zerado com sucesso!');
            }
        }

        function exportarBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_bella_douce_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importarBackup(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    db = JSON.parse(e.target.result);
                    salvarDB();
                    alert('Backup restaurado com sucesso!');
                } catch (err) {
                    alert('Ficheiro de backup inválido!');
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        function atualizarTudo() {
            // Atualizar Select PDV
            const selectPDV = document.getElementById('pdv-produto');
            selectPDV.innerHTML = db.produtos.map(p => `<option value="${p.id}">${p.nome} - R$ ${p.preco.toFixed(2)} (${p.qtd} em estoque)</option>`).join('') || '<option>Nenhum produto cadastrado</option>';

            // Atualizar Lista Estoque
            document.getElementById('estoque-lista').innerHTML = db.produtos.map(p => `
                <div class="flex justify-between items-center p-2 bg-slate-50 rounded-lg border border-slate-100">
                    <div>
                        <span class="font-semibold block text-slate-800">${p.nome}</span>
                        <span class="text-xs text-slate-400">Custo: R$ ${p.custo.toFixed(2)} | Venda: R$ ${p.preco.toFixed(2)}</span>
                    </div>
                    <span class="font-bold text-sky-600 bg-sky-50 px-2 py-1 rounded-md border border-sky-100">${p.qtd} un.</span>
                </div>
            `).join('') || '<p class="text-slate-400 text-center py-2">Nenhum produto</p>';

            // Atualizar Carrinho
            let totalCarrinho = 0;
            document.getElementById('carrinho-lista').innerHTML = db.carrinho.map(item => {
                totalCarrinho += item.preco * item.qtdCarrinho;
                return `
                    <div class="flex justify-between items-center py-1">
                        <span>${item.nome} (${item.qtdCarrinho}x)</span>
                        <span class="font-semibold">R$ ${(item.preco * item.qtdCarrinho).toFixed(2)}</span>
                    </div>
                `;
            }).join('') || '<p class="text-slate-400 text-center py-2">Carrinho vazio</p>';
            document.getElementById('carrinho-total').innerText = `R$ ${totalCarrinho.toFixed(2)}`;

            // Relatórios
            const faturamento = db.vendas.reduce((acc, v) => acc + (v.preco * v.qtdCarrinho), 0);
            const custoTotal = db.vendas.reduce((acc, v) => acc + (v.custo * v.qtdCarrinho), 0);
            document.getElementById('rel-faturamento').innerText = `R$ ${faturamento.toFixed(2)}`;
            document.getElementById('rel-lucro').innerText = `R$ ${(faturamento - custoTotal).toFixed(2)}`;
        }

        atualizarTudo();
    </script>
</body>
</html>
